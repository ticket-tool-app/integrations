name: Release Minecraft

on:
  push:
    tags: ["minecraft-v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#minecraft-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not minecraft-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Checksum
        working-directory: minecraft/build/libs
        run: sha256sum "TicketToolLink-${{ steps.version.outputs.version }}.jar" > "TicketToolLink-${{ steps.version.outputs.version }}.jar.sha256"

      # Several plugins release from this repo, so GitHub's single "latest" badge
      # would point at whichever shipped last; docs link to a filtered list instead.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # release-please creates the release first; a hand-pushed tag has none yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "minecraft/build/libs/TicketToolLink-$VERSION.jar" "minecraft/build/libs/TicketToolLink-$VERSION.jar.sha256"
            gh release edit "$TAG" --title "Ticket Tool Link $VERSION" --latest=false $prerelease
          else
            gh release create "$TAG" --title "Ticket Tool Link $VERSION" --generate-notes --verify-tag --latest=false $prerelease "minecraft/build/libs/TicketToolLink-$VERSION.jar" "minecraft/build/libs/TicketToolLink-$VERSION.jar.sha256"
          fi
