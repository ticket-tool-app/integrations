name: Release CS2

on:
  push:
    tags: ["cs2-v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#cs2-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not cs2-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          dotnet test sdk-dotnet/tests/TicketTool.PluginSdk.Tests
          dotnet test cs2/tests/TicketToolLink.Tests

      - name: Build
        run: cs2/package.sh "${{ steps.version.outputs.version }}"

      - name: Checksum
        working-directory: cs2/dist
        run: sha256sum "TicketToolLink-cs2-${{ steps.version.outputs.version }}.zip" > "TicketToolLink-cs2-${{ steps.version.outputs.version }}.zip.sha256"

      # Several plugins release from this repo, so GitHub's single "latest" badge
      # would point at whichever shipped last; docs link to a filtered list instead.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # release-please creates the release first; a hand-pushed tag has none yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "cs2/dist/TicketToolLink-cs2-$VERSION.zip" "cs2/dist/TicketToolLink-cs2-$VERSION.zip.sha256"
            gh release edit "$TAG" --title "Ticket Tool Link for Counter-Strike 2 $VERSION" --latest=false $prerelease
          else
            gh release create "$TAG" --title "Ticket Tool Link for Counter-Strike 2 $VERSION" --generate-notes --verify-tag --latest=false $prerelease "cs2/dist/TicketToolLink-cs2-$VERSION.zip" "cs2/dist/TicketToolLink-cs2-$VERSION.zip.sha256"
          fi
