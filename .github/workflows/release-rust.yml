name: Release Rust

on:
  push:
    tags: ["rust-v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#rust-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not rust-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test SDK
        run: |
          dotnet test sdk-dotnet/tests/TicketTool.PluginSdk.Tests
          dotnet test sdk-dotnet/tests/TicketTool.PluginSdk.Tests -p:SdkTargetFramework=netstandard2.1

      - name: Build
        run: python3 rust/build.py "${{ steps.version.outputs.version }}"

      - name: Check
        run: |
          dotnet build rust/check
          dotnet build rust/check -p:Carbon=true
          dotnet test rust/tests

      - name: Checksum
        working-directory: rust/dist
        run: sha256sum "TicketToolLink-rust-${{ steps.version.outputs.version }}.cs" > "TicketToolLink-rust-${{ steps.version.outputs.version }}.cs.sha256"

      # Several plugins release from this repo, so GitHub's single "latest" badge
      # would point at whichever shipped last; docs link to a filtered list instead.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # release-please creates the release first; a hand-pushed tag has none yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "rust/dist/TicketToolLink-rust-$VERSION.cs" "rust/dist/TicketToolLink-rust-$VERSION.cs.sha256"
            gh release edit "$TAG" --title "Ticket Tool Link for Rust $VERSION" --latest=false $prerelease
          else
            gh release create "$TAG" --title "Ticket Tool Link for Rust $VERSION" --generate-notes --verify-tag --latest=false $prerelease "rust/dist/TicketToolLink-rust-$VERSION.cs" "rust/dist/TicketToolLink-rust-$VERSION.cs.sha256"
          fi
