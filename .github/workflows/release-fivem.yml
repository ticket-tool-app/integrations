name: Release FiveM

on:
  push:
    tags: ["fivem-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fivem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Remember the Node 16 binary
        run: echo "TTL_E2E_NODE=$(which node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fivem/package-lock.json

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#fivem-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not fivem-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package
        run: node scripts/build.mjs --package --version "${{ steps.version.outputs.version }}"

      - name: Checksum
        working-directory: fivem/build
        run: sha256sum "ticket-tool-link-fivem-${{ steps.version.outputs.version }}.zip" > "ticket-tool-link-fivem-${{ steps.version.outputs.version }}.zip.sha256"

      # Several plugins release from this repo, so GitHub's single "latest" badge
      # would point at whichever shipped last; docs link to a filtered list instead.
      - name: Publish GitHub release
        working-directory: fivem/build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --title "Ticket Tool Link for FiveM $VERSION" \
            --generate-notes \
            --verify-tag \
            --latest=false \
            $prerelease \
            "ticket-tool-link-fivem-$VERSION.zip" \
            "ticket-tool-link-fivem-$VERSION.zip.sha256"
