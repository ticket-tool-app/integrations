name: Release FiveM

on:
  push:
    tags: ["fivem-v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fivem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "16"

      - name: Remember the Node 16 binary
        run: echo "TTL_E2E_NODE=$(which node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fivem/package-lock.json

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#fivem-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not fivem-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package
        run: node scripts/build.mjs --package --version "${{ steps.version.outputs.version }}"

      - name: Checksum
        working-directory: fivem/build
        run: sha256sum "ticket-tool-link-fivem-${{ steps.version.outputs.version }}.zip" > "ticket-tool-link-fivem-${{ steps.version.outputs.version }}.zip.sha256"

      # Several plugins release from this repo, so GitHub's single "latest" badge
      # would point at whichever shipped last; docs link to a filtered list instead.
      - name: Publish GitHub release
        working-directory: fivem/build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # release-please creates the release first; a hand-pushed tag has none yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "ticket-tool-link-fivem-$VERSION.zip" "ticket-tool-link-fivem-$VERSION.zip.sha256"
            gh release edit "$TAG" --title "Ticket Tool Link for FiveM $VERSION" --latest=false $prerelease
          else
            gh release create "$TAG" --title "Ticket Tool Link for FiveM $VERSION" --generate-notes --verify-tag --latest=false $prerelease "ticket-tool-link-fivem-$VERSION.zip" "ticket-tool-link-fivem-$VERSION.zip.sha256"
          fi
